# fmz-dashboard（Tencent CVM）
# Nginx：TencentOS 3 AppStream 使用模块流 nginx:1.24（dnf module reset nginx && dnf module enable nginx:1.24 && dnf install nginx && dnf update 'nginx-*'）。
# TencentOS / OpenCloudOS / Alma（RHEL）：本文件上传到 /etc/nginx/conf.d/fmz-dashboard.conf
# 与 nginx-fmz-dashboard-locations.inc 同目录（见下方 include 路径）。
#
# :80 提供完整站点；HTTPS 异常时可使用 http://www.域名/（若曾收过 HSTS 需清除站点数据）。
#
# 注意：不要在 /etc/nginx/nginx.conf 再嵌一套 listen 443，会与本站冲突。

# --- HTTP：ACME + 正式站点（不强制跳 HTTPS）---
server {
    listen 80;
    server_name www.dianfanbao.net dianfanbao.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fmz-dashboard;
    }

    include /etc/nginx/conf.d/nginx-fmz-dashboard-locations.inc;
}

# --- HTTPS（保留；失败时可改用 http://）---
server {
    # 先关 http2，避免 ALPN 在部分网络下异常；稳定后可改回「443 ssl http2」
    listen 443 ssl;
    listen 8443 ssl; # 备选端口：若仅 443 被链路干扰，在云安全组放行 TCP 8443 后可用 https://域名:8443/
    server_name www.dianfanbao.net dianfanbao.net;

    ssl_certificate     /etc/nginx/dianfanbao.net_bundle.crt;
    ssl_certificate_key /etc/nginx/dianfanbao.net.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_FMZ:10m;
    ssl_session_tickets off;

    # 移动网 + OpenSSL-FIPS 常见报错：unsupported protocol / 客户端 RST。保守档：
    # 仅 TLS 1.2、仅 ECDHE-RSA-AES-GCM、NIST 曲线（RSA DV 证书）。全网稳定后再开 TLS 1.3 / http2 / ChaCha。
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve prime256v1:secp384r1;

    # 已关闭 HSTS，避免浏览器长期只走 https:// 无法救急

    include /etc/nginx/conf.d/nginx-fmz-dashboard-locations.inc;
}
